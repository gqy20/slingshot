<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">物理实验室：把直觉放进实验里</title>
  <desc id="desc">深色横版封面。一颗橙色小球从左下方的弹弓出发，沿连续轨迹向右运动，配合“物理实验室”和“把直觉放进实验里”两层文字。</desc>

  <defs>
    <style>
      @font-face {
        font-family: "Sarasa Cover";
        src: url("../fonts/SarasaGothicSC-Regular.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: "Sarasa Cover";
        src: url("../fonts/SarasaGothicSC-SemiBold.ttf") format("truetype");
        font-weight: 600;
      }
      @font-face {
        font-family: "Smiley Cover";
        src: url("../fonts/SmileySans-Oblique.ttf") format("truetype");
      }
      .sans { font-family: "Sarasa Cover", "Microsoft YaHei", sans-serif; }
      .display { font-family: "Smiley Cover", "Sarasa Cover", "Microsoft YaHei", sans-serif; }
    </style>

    <pattern id="minor-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30343B" stroke-width="1" opacity="0.13"/>
    </pattern>
    <pattern id="major-grid" width="128" height="128" patternUnits="userSpaceOnUse">
      <rect width="128" height="128" fill="url(#minor-grid)"/>
      <path d="M128 0H0V128" fill="none" stroke="#59606B" stroke-width="1.25" opacity="0.11"/>
    </pattern>
    <radialGradient id="field-glow" cx="74%" cy="66%" r="58%">
      <stop offset="0" stop-color="#FF8A3D" stop-opacity="0.10"/>
      <stop offset="0.44" stop-color="#2B150B" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#050608" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball-fill" cx="34%" cy="28%" r="72%">
      <stop offset="0" stop-color="#FFD3A1"/>
      <stop offset="0.28" stop-color="#FFB15C"/>
      <stop offset="0.72" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#C64C15"/>
    </radialGradient>
    <linearGradient id="trajectory" x1="208" y1="350" x2="856" y2="306" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A3D" stop-opacity="0.26"/>
      <stop offset="0.28" stop-color="#FF8A3D" stop-opacity="0.70"/>
      <stop offset="0.72" stop-color="#FFB15C"/>
      <stop offset="1" stop-color="#D7D3CA" stop-opacity="0.52"/>
    </linearGradient>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="ball-shadow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="safe-field">
      <rect x="26" y="26" width="908" height="488" rx="16"/>
    </clipPath>
  </defs>

  <!-- Stage -->
  <rect width="960" height="540" fill="#050608"/>
  <g clip-path="url(#safe-field)">
    <rect x="26" y="26" width="908" height="488" fill="url(#major-grid)"/>
    <rect x="26" y="26" width="908" height="488" fill="url(#field-glow)"/>
    <circle cx="700" cy="354" r="128" fill="#FF8A3D" opacity="0.025" filter="url(#soft-glow)"/>
  </g>
  <rect x="26.75" y="26.75" width="906.5" height="486.5" rx="15.25" fill="none" stroke="#30343B" stroke-width="1.5"/>

  <!-- Series title -->
  <g class="display">
    <text x="61" y="179" fill="#F4F1EA" font-size="94" letter-spacing="0">物理实验室</text>
  </g>
  <g class="sans">
    <text x="64" y="237" fill="#FFB15C" font-size="30" font-weight="600" letter-spacing="0.4">把直觉放进实验里</text>
  </g>

  <!-- Slingshot and continuous experiment curve -->
  <g>
    <path d="M98 466L127 365M98 466L220 389" fill="none" stroke="#D7D3CA" stroke-width="12" stroke-linecap="round"/>
    <path d="M127 365L208 350M220 389L208 350" fill="none" stroke="#FF8A3D" stroke-width="5" stroke-linecap="round" opacity="0.92"/>
    <circle cx="208" cy="350" r="13" fill="#FF8A3D"/>

    <path d="M208 350C344 266 470 263 598 326C699 376 778 397 856 306" fill="none" stroke="#7594B3" stroke-width="1.75" stroke-dasharray="4 10" opacity="0.26"/>

    <path d="M208 350C329 230 470 231 596 307C680 358 745 424 856 306" fill="none" stroke="#FF8A3D" stroke-width="14" stroke-linecap="round" opacity="0.08" filter="url(#soft-glow)"/>
    <path d="M208 350C329 230 470 231 596 307C680 358 745 424 856 306" fill="none" stroke="url(#trajectory)" stroke-width="5.5" stroke-linecap="round"/>

    <circle cx="652" cy="347" r="45" fill="#FF8A3D" opacity="0.11" filter="url(#soft-glow)"/>
    <circle cx="652" cy="347" r="27" fill="url(#ball-fill)" filter="url(#ball-shadow)"/>
    <circle cx="643" cy="338" r="7" fill="#FFF0D8" opacity="0.72"/>
  </g>
</svg>
